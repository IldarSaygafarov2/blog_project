<div class="card h-100">
  {% if article.image %}
  <img src="{{ article.image.url }}" class="card-img-top" alt="..."
       style="height: 304px">
  {% else %}
  <img src="https://olmeko.ru/upload/iblock/2e0/net-kartinki.jpg" class="card-img-top" alt="..." style="height: 304px">
  {% endif %}

  <div class="card-body">
    <h5 class="card-title">{{ article.title }}</h5>
    <p class="card-text">{{ article.short_description }}</p>
  </div>
  <ul class="list-group list-group-flush">
    <li class="list-group-item">
      <b>Просмотры: </b> {{ article.views }}
    </li>
    <li class="list-group-item">
      <b>Категория: </b>
      <a href="{% url 'category-page' article.category.pk %}">{{ article.category.name }}</a>
    </li>
    <li class="list-group-item">
      <b>Автор: </b> <a href="{% url 'profile' article.author.username %}">{{ article.author.username }}</a>
    </li>
    <li class="list-group-item">
      <b>Дата публикации: </b> <br> {{ article.created_at }}
    </li>
  </ul>
  <div class="card-body d-flex align-items-end">
    <a href="{% url 'article-page' article.pk %}" class="card-link">Подробнее</a>
  </div>
</div>
