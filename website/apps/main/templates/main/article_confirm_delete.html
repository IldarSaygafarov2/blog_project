{% extends 'base.html' %}

{% block title %}
Удаление статьи: {{ article.title }}
{% endblock %}

{% block content %}
<form action="" method="post" class="mt-5">
    {% csrf_token %}
    <p><i>Вы действительно хотите удалить статью: <b>{{ article.title }}</b></i></p>
    <input type="submit" value="Да, удалить" class="btn btn-danger">
    <a href="{% url 'article-page' article.pk %}" class="btn btn-primary ms-3">Вернуться обратно</a>
</form>
{% endblock %}
